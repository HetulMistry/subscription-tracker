site_name: Subscription Tracker
site_description: Subscription management platform built with Node.js, Express, MongoDB, Arcjet, JWT, and Upstash Workflows
site_url: https://subscription-tracker.wiki.hetulmistry.tech

docs_dir: wiki

theme:
  name: material
  color_mode: auto
  user_color_mode_toggle: true
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

nav:
  - Home: index.md

  - Getting Started:
      - Overview: Overview.md
      - Getting Started: Getting-Started.md
      - Project Structure: Project-Structure.md

  - Architecture:
